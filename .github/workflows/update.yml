name: Update node catalog
'on':
  workflow_dispatch:
    inputs:
      core_ref:
        description: Owned VPN-Core ref resolved once per run
        type: string
        default: main
      publish_run_id:
        description: Publish saved results from this completed run ID; leave empty for a new scan
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owned-core:
    if: ${{ !inputs.publish_run_id }}
    name: Build pinned owner core once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pipeline_revision: ${{ steps.pin.outputs.revision }}
      core_matrix: ${{ steps.pin.outputs.core_matrix }}
      core_parallelism: ${{ steps.pin.outputs.core_parallelism }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: noorelmostafa11-pixel/VPN-Nodes-Private
        ssh-key: ${{ secrets.VPN_NODES_PRIVATE_READ_KEY }}
        ref: main
        path: catalog-source
        fetch-depth: 0
        persist-credentials: false
    - name: Pin private source once
      id: pin
      shell: bash
      run: "echo \"revision=$(git -C catalog-source rev-parse HEAD)\" >> \"$GITHUB_OUTPUT\"\npython3 - <<'PY' >> \"$GITHUB_OUTPUT\"\nimport json,sys\n\
        from pathlib import Path\nsys.path.insert(0, str(Path(\"catalog-source/scripts/xray_matrix\").resolve()))\nfrom owned_core import MATRIX_SHARDS\n\
        for stage, count in ((\"core\", MATRIX_SHARDS),):\n    if type(count) is not int or not 1 <= count <= 256:\n        raise ValueError(\"\
        Invalid pinned pipeline shard count\")\n    print(stage + \"_matrix=\" + json.dumps(list(range(count)), separators=(\",\", \":\")))\n\
        \    print(stage + \"_parallelism=\" + str(count))\nPY\n"
    - uses: ./catalog-source/.github/actions/catalog
      with:
        stage: owned-core
        private_revision: ${{ steps.pin.outputs.revision }}
        node_key: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
        core_ref: ${{ inputs.core_ref || 'main' }}
        core_token: ${{ secrets.VPN_CORE_READ_TOKEN }}
        core_key: ${{ secrets.VPN_CORE_ARTIFACT_KEY_B64 }}
  candidates:
    if: ${{ !inputs.publish_run_id }}
    needs:
    - owned-core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: noorelmostafa11-pixel/VPN-Nodes-Private
        ssh-key: ${{ secrets.VPN_NODES_PRIVATE_READ_KEY }}
        ref: ${{ needs.owned-core.outputs.pipeline_revision }}
        path: catalog-source
        fetch-depth: 0
        persist-credentials: false
    - uses: ./catalog-source/.github/actions/catalog
      with:
        stage: candidates
        private_revision: ${{ needs.owned-core.outputs.pipeline_revision }}
        node_key: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
        core_key: ${{ secrets.VPN_CORE_ARTIFACT_KEY_B64 }}
        megav_key: ${{ secrets.MEGAV_CATALOG_KEY_B64 }}
  core-check:
    if: ${{ !inputs.publish_run_id }}
    needs:
    - candidates
    - owned-core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.owned-core.outputs.core_parallelism) }}
      matrix:
        shard: ${{ fromJSON(needs.owned-core.outputs.core_matrix) }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: noorelmostafa11-pixel/VPN-Nodes-Private
        ssh-key: ${{ secrets.VPN_NODES_PRIVATE_READ_KEY }}
        ref: ${{ needs.owned-core.outputs.pipeline_revision }}
        path: catalog-source
        fetch-depth: 0
        persist-credentials: false
    - uses: ./catalog-source/.github/actions/catalog
      with:
        stage: core-check
        private_revision: ${{ needs.owned-core.outputs.pipeline_revision }}
        node_key: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
        core_key: ${{ secrets.VPN_CORE_ARTIFACT_KEY_B64 }}
        country_url: ${{ secrets.VPN_COUNTRY_URL }}
        shard: ${{ matrix.shard }}
  publish:
    needs:
    - candidates
    - core-check
    - owned-core
    if: ${{ always() && !cancelled() && (inputs.publish_run_id || (needs.candidates.result == 'success' && needs.core-check.result == 'success'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
    - name: Reserve time for signing and publication
      shell: bash
      run: echo "A1_RANK_DEADLINE=$(( $(date +%s) + 2400 ))" >> "$GITHUB_ENV"
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        path: runner-source
        sparse-checkout: .github/pipeline_context.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Resolve trusted private source
      id: context
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.publish_run_id }}
        EXPECTED_PIPELINE_REVISION: ${{ needs.owned-core.outputs.pipeline_revision }}
      run: python3 runner-source/.github/pipeline_context.py
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: noorelmostafa11-pixel/VPN-Nodes-Private
        ssh-key: ${{ secrets.VPN_NODES_PRIVATE_WRITE_KEY }}
        ref: ${{ inputs.publish_run_id && 'main' || steps.context.outputs.pipeline_revision }}
        path: catalog-source
        fetch-depth: 0
        persist-credentials: true
    - name: Pin publication implementation once
      id: publish_revision
      shell: bash
      run: echo "revision=$(git -C catalog-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: ./catalog-source/.github/actions/catalog
      with:
        stage: publish
        private_revision: ${{ steps.publish_revision.outputs.revision }}
        node_key: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
        publish_run_id: ${{ inputs.publish_run_id }}
        source_run_id: ${{ steps.context.outputs.source_run_id }}
        source_private_revision: ${{ steps.context.outputs.source_pipeline_revision }}
        legacy_source: ${{ steps.context.outputs.legacy_source }}
        signing_key: ${{ secrets.CATALOG_SIGNING_PRIVATE_KEY_B64 }}
        core_key: ${{ secrets.VPN_CORE_ARTIFACT_KEY_B64 }}
        a1_ssh_key: ${{ secrets.A1_REAL_DELAY_SSH_KEY }}
