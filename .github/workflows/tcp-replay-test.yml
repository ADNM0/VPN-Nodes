name: Temporary A1 TCP replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: noorelmostafa11-pixel/VPN-Nodes-Private
          ssh-key: ${{ secrets.VPN_NODES_PRIVATE_WRITE_KEY }}
          ref: main
          path: catalog-source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install private replay dependencies
        working-directory: catalog-source
        run: python -m pip install -r requirements.txt
      - name: Download saved candidate snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '41557677872'
          name: xray-candidates
          path: /tmp/tcp-replay-candidates
      - name: Download all saved core checker shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '41557677872'
          pattern: xray-shard-*
          path: /tmp/tcp-replay-shards
      - name: Measure, rebuild, sign and publish saved successes
        working-directory: catalog-source
        env:
          GH_TOKEN: ${{ github.token }}
          VPN_NODES_ARTIFACT_KEY_B64: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
          A1_TCP_PING_SSH_KEY: ${{ secrets.A1_TCP_PING_SSH_KEY }}
          A1_TCP_PING_KNOWN_HOSTS: ${{ secrets.A1_TCP_PING_KNOWN_HOSTS }}
          A1_TCP_PING_WORKERS: ${{ vars.A1_TCP_PING_WORKERS }}
          CATALOG_SIGNING_PRIVATE_KEY_B64: ${{ secrets.CATALOG_SIGNING_PRIVATE_KEY_B64 }}
          REQUIRE_CATALOG_SIGNATURE: '1'
        run: python scripts/run_private_step.py pipeline/steps/tcp-replay-test.sh --stage tcp-replay-test
      - name: Report safe replay counters
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/tcp-replay-summary.json" ]; then
            cat "$RUNNER_TEMP/tcp-replay-summary.json" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Encrypt private replay diagnostics
        if: ${{ always() }}
        continue-on-error: true
        working-directory: catalog-source
        env:
          VPN_NODES_ARTIFACT_KEY_B64: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
        run: |
          if [ -d "$RUNNER_TEMP/private-logs/tcp-replay-test-0" ]; then
            python scripts/artifact_transport.py pack --source "$RUNNER_TEMP/private-logs/tcp-replay-test-0" --destination "$RUNNER_TEMP/tcp-replay-diagnostics/data.bundle" --kind diagnostics-tcp-replay-test-0
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: diagnostics-tcp-replay-test-0
          path: ${{ runner.temp }}/tcp-replay-diagnostics/data.bundle
          retention-days: 7
          if-no-files-found: warn
